<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Pulse Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <h1 class="logo">Market Pulse</h1>
        <div id="live-clock" class="clock">2026.08.02. 00:00:00</div>
      </div>
      <div class="header-right">
        <button id="refresh-btn" class="btn btn-sub">새로고침</button>
        <button id="theme-toggle" class="btn btn-sub">라이트모드</button>
      </div>
    </header>

    <section class="section">
      <h2 class="section-title">1. 주요 환율</h2>
      <div class="grid grid-6" id="forex-grid"></div>
    </section>

    <section class="section">
      <h2 class="section-title">2. 시장 지수 · ETF</h2>
      <div class="grid grid-4" id="indices-grid"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2 class="section-title">3. 관심 종목</h2>
        <div class="add-symbol-form">
          <input type="text" id="symbol-input" placeholder="종목명/티커 입력 (예: 삼성전자, NVDA)">
          <button id="add-symbol-btn" class="btn btn-main">+ 추가</button>
        </div>
      </div>
      <div class="grid grid-4" id="watchlist-grid"></div>
    </section>

    <section class="section">
      <h2 class="section-title">4. IPO 공모주 일정</h2>
      <div class="card ipo-card" id="ipo-container">
        <p class="loading">IPO 일정을 불러오는 중입니다...</p>
      </div>
    </section>
  </div>

  <div id="chart-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">차트</h3>
        <span class="close-btn" id="close-modal">&times;</span>
      </div>
      <div class="modal-body" id="tradingview-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
